# Test overrides: in-memory database, no real email/SMS.
spring.datasource.url=jdbc:h2:mem:market;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.jwtSecret=test-secret-that-is-at-least-32-bytes-long
app.admin.username=admin
app.admin.password=admin-password
app.admin.email=admin@example.com

mail.enabled=false
sms.enabled=false
