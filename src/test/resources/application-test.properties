# Test overrides: in-memory database, no real email/SMS.
spring.datasource.url=jdbc:h2:mem:market;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# H2's syntax for the 3s lock wait limit set for PostgreSQL in application.properties.
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 3000
spring.datasource.hikari.exception-override-class-name=com.market.H2LockTimeoutOverride
spring.flyway.url=jdbc:h2:mem:market;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.flyway.user=sa
spring.flyway.password=

app.jwtSecret=test-secret-that-is-at-least-32-bytes-long
app.admin.username=admin
app.admin.password=admin-password
app.admin.email=admin@example.com

# The tests sign up many users from the same address.
app.signup.maxPerHourPerClient=1000

mail.enabled=false
sms.enabled=false
