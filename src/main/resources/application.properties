# Spring Properties
server.port=${PORT:8080}
# The client IP (used for sign-in throttling) comes from X-Forwarded-For only when the request arrives from a trusted
# proxy. By default only a proxy on the same host (loopback) is trusted: trusting all private addresses would let any
# client spoof its IP when, for example, Docker's port publishing makes every request come from the bridge gateway.
# Behind a load balancer, set TRUSTED_PROXIES to a regex matching its addresses, e.g. 10\.0\.\d+\.\d+
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127\\.\\d+\\.\\d+\\.\\d+|0:0:0:0:0:0:0:1|::1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/market}
spring.datasource.username=${DB_USERNAME:market}
spring.datasource.password=${DB_PASSWORD:market}

# The schema is created and changed by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
# Timestamps are written and read as UTC, so moving the server to another time zone doesn't shift stored times
# (for example which item price is currently active).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# No statement waits more than 3s for a row lock (e.g. the OTP row lock), so a stalled transaction can't pile up
# requests and exhaust the connection pool; the waiting request gets a 409 and can retry.
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:SET lock_timeout = '3s'}
# Migrations must not give up after 3s waiting for a table lock (e.g. during a rolling deploy). Giving Flyway its own
# connection settings makes Spring Boot create a separate data source for it, without the pool's lock_timeout; a
# session setting on a pooled connection would otherwise leak back into the app's connections.
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5433/market}
spring.flyway.user=${DB_USERNAME:market}
spring.flyway.password=${DB_PASSWORD:market}
# Hibernate logs every SQL error at ERROR before the app handles it; expected ones (a lock timeout answered with 409,
# a duplicate answered with 409) would look like failures. The app's handlers log what matters, with the cause.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read a little past an oversized upload so the client receives the 413 instead of a connection reset.
# Kept just above max-request-size: this also applies to rejected (e.g. unauthenticated) requests.
server.tomcat.max-swallow-size=8MB

# Email Properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS Properties
twilio.sms.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.sms.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.twilio.number=${TWILIO_NUMBER:}

# App Properties
# Required: HS256 needs a secret of at least 32 bytes. There is no default so a deployment
# can't silently run with a publicly known key. `./gradlew bootRun` sets a local-only one.
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.otpExpirationMs=${OTP_EXPIRATION_MS:600000}

# Optional: an admin account created at startup if it doesn't exist yet.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}

app.order.deliveryCharge=${DELIVERY_CHARGE:2.00}

# Sign-ups allowed per client address per hour (sign-up reveals whether an email is registered).
app.signup.maxPerHourPerClient=${SIGNUP_MAX_PER_HOUR:10}

mail.enabled=${MAIL_ENABLED:false}
sms.enabled=${SMS_ENABLED:false}

otp.size=5

springdoc.swagger-ui.path=/swagger-ui.html
# Set API_DOCS_ENABLED=false in production to stop publishing the API description and Swagger UI.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
