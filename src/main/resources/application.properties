# Spring Properties
server.port=${PORT:8080}
# The client IP (used for sign-in throttling) comes from X-Forwarded-For when the request arrives from a private-network
# proxy (Tomcat's default trusted range); direct clients can't spoof it. Set to "none" if the app is exposed directly
# and its own network is untrusted.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/market}
spring.datasource.username=${DB_USERNAME:market}
spring.datasource.password=${DB_PASSWORD:market}

# The schema is created and changed by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read a little past an oversized upload so the client receives the 413 instead of a connection reset.
# Kept just above max-request-size: this also applies to rejected (e.g. unauthenticated) requests.
server.tomcat.max-swallow-size=8MB

# Email Properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS Properties
twilio.sms.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.sms.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.twilio.number=${TWILIO_NUMBER:}

# App Properties
# Required: HS256 needs a secret of at least 32 bytes. There is no default so a deployment
# can't silently run with a publicly known key. `./gradlew bootRun` sets a local-only one.
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.otpExpirationMs=${OTP_EXPIRATION_MS:600000}

# Optional: an admin account created at startup if it doesn't exist yet.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}

app.order.deliveryCharge=${DELIVERY_CHARGE:2.00}

mail.enabled=${MAIL_ENABLED:false}
sms.enabled=${SMS_ENABLED:false}

otp.size=5

springdoc.swagger-ui.path=/swagger-ui.html
