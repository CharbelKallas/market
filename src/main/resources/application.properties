# Spring Properties
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/market}
spring.datasource.username=${DB_USERNAME:market}
spring.datasource.password=${DB_PASSWORD:market}

# "update" keeps data between restarts but never alters or drops existing columns.
# Use "create-drop" for a throwaway local DB. See the README about databases created by older versions.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Email Properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS Properties
twilio.sms.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.sms.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.sms.twilio.number=${TWILIO_NUMBER:}

# App Properties
# Required: HS256 needs a secret of at least 32 bytes. There is no default so a deployment
# can't silently run with a publicly known key. The "dev" profile sets one for local use.
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

app.otpExpirationMs=${OTP_EXPIRATION_MS:600000}

# Optional: an admin account created at startup if it doesn't exist yet.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}

app.order.deliveryCharge=${DELIVERY_CHARGE:2.00}

mail.enabled=${MAIL_ENABLED:false}
sms.enabled=${SMS_ENABLED:false}

otp.size=5

springdoc.swagger-ui.path=/swagger-ui.html
